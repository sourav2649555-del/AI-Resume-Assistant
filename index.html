
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Resume Assistant Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>

/* ===== BASIC RESET ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
}

/* ===== NAVBAR ===== */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
}

nav .logo{
font-size:24px;
font-weight:700;
color:#ff4da6;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
opacity:0.8;
}

nav a:hover{
color:#ff4da6;
}

/* ===== HERO ===== */
.hero{
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:50px;
background:linear-gradient(to right,#ff4da6,#00ffee);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
margin-top:10px;
opacity:0.8;
}

/* ===== UPLOAD BOX ===== */
.container{
max-width:600px;
margin:40px auto;
padding:30px;
background:rgba(255,255,255,0.05);
border-radius:20px;
text-align:center;
backdrop-filter:blur(15px);
box-shadow:0 0 20px rgba(255,255,255,0.1);
}

/* hide file input */
input[type="file"]{
display:none;
}

/* custom upload button */
.upload-label{
display:inline-block;
padding:15px 25px;
border-radius:12px;
border:2px dashed #ff4da6;
cursor:pointer;
transition:0.3s;
margin-bottom:20px;
}

.upload-label:hover{
background:#ff4da6;
transform:scale(1.05);
}

/* button */
button{
padding:15px 30px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#ff004c,#ff4da6);
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
margin-top:10px;
}

button:hover{
transform:scale(1.05);
}

/* ===== RESULT ===== */
#result{
max-width:800px;
margin:40px auto;
padding:30px;
background:rgba(255,255,255,0.05);
border-radius:20px;
display:none;
backdrop-filter:blur(15px);
}

.score{
font-size:40px;
text-align:center;
color:#00ff99;
margin:20px 0;
}

.section{
margin-top:20px;
}

.section h3{
color:#00ffee;
margin-bottom:10px;
}

/* ===== FOOTER ===== */
footer{
text-align:center;
padding:20px;
opacity:0.6;
margin-top:40px;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav>
<div class="logo">🤖 AI Resume Assistant</div>

<div>
<a href="#">Home</a>
<a href="#">Features</a>
<a href="#">About</a>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<h1>AI Resume Analyzer</h1>
<p>Upload your resume and get AI ATS score + feedback</p>
</section>

<!-- UPLOAD BOX -->
<div class="container">

<h2>Upload Resume</h2>
<p>Only PDF supported</p>

<input type="file" id="file" accept=".pdf">

<label for="file" class="upload-label">
📄 Choose Resume
</label>

<br>

<button onclick="analyze()">Analyze Resume</button>

</div>

<!-- RESULT -->
<div id="result"></div>

<!-- FOOTER -->
<footer>
© 2026 AI Resume Assistant
</footer>

<script>

let textData = "";

// READ PDF
document.getElementById("file").addEventListener("change", async function(e){

let file = e.target.files[0];
if(!file) return;

let reader = new FileReader();

reader.onload = async function(){

let typedarray = new Uint8Array(this.result);

let pdf = await pdfjsLib.getDocument(typedarray).promise;

textData = "";

for(let i=1;i<=pdf.numPages;i++){
let page = await pdf.getPage(i);
let content = await page.getTextContent();
textData += content.items.map(item => item.str).join(" ") + " ";
}

};

reader.readAsArrayBuffer(file);

});

// ANALYZE FUNCTION
async function analyze(){

if(!textData){
alert("Please upload resume first!");
return;
}

// simple ATS score logic
let score = 50;

let keywords = ["html","css","javascript","react","project","experience","skills"];

keywords.forEach(k=>{
if(textData.toLowerCase().includes(k)){
score += 5;
}
});

if(textData.length > 1000) score += 10;

if(score > 100) score = 100;

// show result
document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML = `

<h2>📊 AI Resume Report</h2>

<div class="score">${score}/100 ATS Score</div>

<div class="section">
<h3>📌 Summary</h3>
<p>${score > 80 ? "Strong Resume 🔥" : "Needs Improvement ⚠️"}</p>
</div>

<div class="section">
<h3>💡 Suggestions</h3>
<p>Add more projects, skills, and achievements for better ATS ranking.</p>
</div>

<div class="section">
<h3>📄 Preview</h3>
<p>${textData.slice(0,300)}...</p>
</div>

`;

}

</script>

</body>
</html>
