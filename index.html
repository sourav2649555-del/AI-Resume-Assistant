<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Assistant Pro</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="background"></div>

<header>
    <h1>AI Resume Assistant</h1>

    <button id="themeToggle">🌙</button>
</header>

<section class="hero">

    <div class="glass-card form-section">

        <h2>Create Your Resume</h2>

        <input type="text" id="name" placeholder="Full Name">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="phone" placeholder="Phone Number">
        <input type="text" id="skills" placeholder="Skills (comma separated)">

        <textarea id="summary" placeholder="Professional Summary"></textarea>

        <textarea id="experience" placeholder="Experience"></textarea>

        <textarea id="education" placeholder="Education"></textarea>

        <button onclick="generateResume()">Generate Resume</button>

        <button onclick="downloadPDF()">Download PDF</button>
        
       <button onclick="googleLogin()">
            Login With Google
        </button>

        <button onclick="saveResume()">
            Save Resume
        </button>

        <button onclick="logout()">
            Logout
        </button>



    </div>

    <div class="glass-card preview-section">

        <h2>Resume Preview</h2>

        <div id="resumePreview"></div>

    </div>

</section>

<section class="dashboard">

    <div class="glass-card stats-card">
        <h3>ATS Score</h3>
        <div id="atsScore">0%</div>
    </div>

    <div class="glass-card stats-card">
        <h3>AI Suggestions</h3>
        <ul id="suggestions">
            <li>Add more measurable achievements.</li>
        </ul>
    </div>

    <div class="glass-card stats-card">
        <h3>Job Match</h3>
        <div id="jobMatch">85%</div>
    </div>

</section>

<section class="upload-section glass-card">

    <h2>Upload Existing Resume</h2>

    <input type="file" id="resumeUpload">

</section>

<script type="module" src="app.js"></script>

</body>
</html>
