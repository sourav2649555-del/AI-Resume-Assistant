<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Resume SaaS Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>

/* ===== BASE ===== */
body{
margin:0;
font-family:Poppins;
background:#0f172a;
color:white;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
padding:15px 30px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
}

/* BUTTON */
button{
padding:10px 20px;
border:none;
border-radius:10px;
cursor:pointer;
background:#ff4da6;
color:white;
}

/* LOGIN BOX FIX */
#loginBox{
max-width:400px;
margin:100px auto;
padding:30px;
background:rgba(255,255,255,0.08);
border-radius:15px;
text-align:center;
backdrop-filter:blur(10px);
box-shadow:0 0 20px rgba(255,255,255,0.1);
position:relative;
z-index:1;
}

/* INPUT FIX (MAIN BUG FIX) */
#loginBox input{
width:90%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:none;
outline:none;
background:#1e293b;
color:white;
font-size:16px;
position:relative;
z-index:10;
pointer-events:auto;
}

#loginBox input:focus{
border:2px solid #ff4da6;
transform:scale(1.02);
transition:0.2s;
}

/* DASHBOARD */
#dashboard{
display:none;
padding:20px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
padding:20px;
margin:20px 0;
border-radius:15px;
backdrop-filter:blur(10px);
}

/* FILE INPUT */
input[type=file]{
display:none;
}

label{
padding:12px 20px;
border:2px dashed #ff4da6;
display:inline-block;
cursor:pointer;
margin-bottom:10px;
border-radius:10px;
}

#loading{
margin-top:10px;
color:#00ffee;
}

#result{
white-space:pre-wrap;
}

</style>

</head>

<body>

<!-- NAV -->
<nav>
<div>🤖 AI SaaS Pro</div>
<button onclick="logout()">Logout</button>
</nav>

<!-- LOGIN -->
<div id="loginBox">

<h2>Login</h2>

<input id="email" type="text" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<br>

<button onclick="login()">Login</button>
<button onclick="signup()">Signup</button>

</div>

<!-- DASHBOARD -->
<div id="dashboard">

<h2>Welcome 👋</h2>

<div class="card">

<h3>Upload Resume</h3>

<input type="file" id="file">

<label for="file">📄 Choose PDF</label>

<div id="loading"></div>

<br>

<button onclick="analyze()">Analyze Resume</button>

</div>

<div class="card" id="result"></div>

<div class="card">
<h3>📜 History</h3>
<div id="history"></div>
</div>

</div>

<script type="module">

/* FIREBASE */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { getFirestore, doc, setDoc, getDoc, arrayUnion } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

let textData = "";
let pdfReady = false;

/* SIGNUP */
window.signup = async () => {
let email = document.getElementById("email").value;
let pass = document.getElementById("pass").value;

await createUserWithEmailAndPassword(auth,email,pass);
alert("Account Created");
}

/* LOGIN */
window.login = async () => {
let email = document.getElementById("email").value;
let pass = document.getElementById("pass").value;

await signInWithEmailAndPassword(auth,email,pass);

document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";

loadHistory();
}

/* LOGOUT */
window.logout = async () => {
await signOut(auth);
location.reload();
}

/* PDF READ FIXED */
document.getElementById("file").addEventListener("change", async (e)=>{

let file = e.target.files[0];
document.getElementById("loading").innerText="Loading PDF... ⏳";

let reader = new FileReader();

reader.onload = async () => {

let pdf = await pdfjsLib.getDocument(new Uint8Array(reader.result)).promise;

textData = "";

for(let i=1;i<=pdf.numPages;i++){
let page = await pdf.getPage(i);
let content = await page.getTextContent();
textData += content.items.map(x=>x.str).join(" ");
}

pdfReady = true;
document.getElementById("loading").innerText="PDF Ready ✅";

};

reader.readAsArrayBuffer(file);

});

/* ANALYZE */
window.analyze = async () => {

if(!pdfReady){
alert("Wait for PDF to load!");
return;
}

let res = await fetch("http://localhost:3000/analyze",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({text:textData})
});

let data = await res.json();

document.getElementById("result").innerHTML=data.result;

/* HISTORY SAVE */
let user = auth.currentUser;

if(user){
await setDoc(doc(db,"users",user.email),{
history: arrayUnion(data.result)
},{merge:true});
}

loadHistory();

}

/* HISTORY */
async function loadHistory(){

let user = auth.currentUser;
if(!user) return;

let snap = await getDoc(doc(db,"users",user.email));

if(snap.exists()){
let data = snap.data().history || [];
document.getElementById("history").innerHTML =
data.map(h=>`📄 ${h.slice(0,200)}...`).join("<br><br>");
}

}

</script>

</body>
</html>
