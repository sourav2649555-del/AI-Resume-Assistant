<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Resume SaaS</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>

/* ===== BASIC UI ===== */
body{
margin:0;
font-family:Poppins;
background:#0f172a;
color:white;
}

nav{
display:flex;
justify-content:space-between;
padding:15px 30px;
background:rgba(255,255,255,0.05);
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
cursor:pointer;
background:#ff4da6;
color:white;
}

/* LOGIN */
#loginBox{
max-width:400px;
margin:100px auto;
padding:30px;
background:rgba(255,255,255,0.05);
border-radius:15px;
text-align:center;
}

/* DASHBOARD */
#dashboard{
display:none;
padding:20px;
}

.card{
background:rgba(255,255,255,0.05);
padding:20px;
margin:20px 0;
border-radius:15px;
}

/* UPLOAD */
input[type=file]{display:none;}

label{
padding:12px 20px;
border:2px dashed #ff4da6;
display:inline-block;
cursor:pointer;
margin-bottom:10px;
}

</style>

</head>

<body>

<!-- NAV -->
<nav>
<div>🤖 AI SaaS</div>
<div>
<button onclick="logout()">Logout</button>
</div>
</nav>

<!-- LOGIN -->
<div id="loginBox">

<h2>Login</h2>

<input id="email" placeholder="Email"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>
<button onclick="signup()">Signup</button>

</div>

<!-- DASHBOARD -->
<div id="dashboard">

<h2>Welcome 👋</h2>

<!-- Upload -->
<div class="card">

<h3>Upload Resume</h3>

<input type="file" id="file">

<label for="file">📄 Choose PDF</label>

<br>

<button onclick="analyze()">Analyze Resume</button>

</div>

<!-- Result -->
<div class="card" id="result"></div>

<!-- HISTORY -->
<div class="card">
<h3>📜 History</h3>
<div id="history"></div>
</div>

</div>

<script type="module">

/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { getFirestore, doc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

/* ================= AUTH ================= */

window.signup = async function(){
let email = document.getElementById("email").value;
let pass = document.getElementById("pass").value;

await createUserWithEmailAndPassword(auth,email,pass);
alert("Account Created");
}

window.login = async function(){
let email = document.getElementById("email").value;
let pass = document.getElementById("pass").value;

await signInWithEmailAndPassword(auth,email,pass);

document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";

loadHistory();
}

window.logout = async function(){
await signOut(auth);
location.reload();
}

/* ================= PDF ================= */
let textData="";

document.getElementById("file").addEventListener("change",async(e)=>{

let file=e.target.files[0];
let reader=new FileReader();

reader.onload=async()=>{

let pdf=await pdfjsLib.getDocument(new Uint8Array(reader.result)).promise;

textData="";

for(let i=1;i<=pdf.numPages;i++){
let page=await pdf.getPage(i);
let content=await page.getTextContent();
textData+=content.items.map(x=>x.str).join(" ");
}

}

reader.readAsArrayBuffer(file);

});

/* ================= ANALYZE ================= */
window.analyze = async function(){

let res = await fetch("http://localhost:3000/analyze",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({text:textData})
});

let data = await res.json();

document.getElementById("result").innerHTML=data.result;

/* SAVE HISTORY */
let user = auth.currentUser;

if(user){
await setDoc(doc(db,"users",user.email),{
lastResult:data.result
});
}

loadHistory();

}

/* ================= HISTORY ================= */
async function loadHistory(){

let user = auth.currentUser;

if(!user) return;

let snap = await getDoc(doc(db,"users",user.email));

if(snap.exists()){
document.getElementById("history").innerHTML =
snap.data().lastResult;
}

}

</script>

</body>
</html>
